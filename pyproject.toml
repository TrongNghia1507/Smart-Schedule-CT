[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-planner-conflict"
version = "0.1.0"
description = "Conflict resolution module for weekly scheduling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "ortools>=9.11,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "conflict_resolver*",
    "schedule_input*",
    "schedule_preparation*",
    "scheduling_algorithm*",
    "user_portal*",
]
namespaces = false

[tool.setuptools.package-data]
schedule_input = ["infrastructure/sample.json", "ui/table_component/index.html"]
scheduling_algorithm = ["history/schedule_history.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
