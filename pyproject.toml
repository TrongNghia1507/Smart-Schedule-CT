[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-planner-conflict"
version = "0.1.0"
description = "Conflict resolution module for weekly scheduling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]