services:
  web:
    build: .
    environment:
      SCHEDULE_ADMIN_PASSWORD: ${SCHEDULE_ADMIN_PASSWORD:-}
      SCHEDULE_SECURE_COOKIE: ${SCHEDULE_SECURE_COOKIE:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-20}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - schedule_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/v1/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_schedule_ct
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_data:/var/lib/mysql

volumes:
  schedule_data: {}
  mysql_data: {}
